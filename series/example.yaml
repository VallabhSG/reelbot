# One file = one account's series. Copy, rename, and point SERIES_FILE at it.
# Asset paths are relative to the repo root. See everyday-boss-fights.yaml for a full, live example.

series:
  name: "NIGHT SHIFT"
  handle: "yourhandle"
  premise: >
    100 jobs that keep a city alive after dark. Each episode is one night worker's sixty seconds of
    quiet heroism, told as a wordless anime micro-film in five beats with a twist ending.
  total_episodes: 100
  header_template: "{series}\nNight {n} / {total}\n{emoji} {category}"

style:
  bible: >
    2D anime feature-film look: clean ink linework, cel-shaded characters with soft painterly gradients,
    hand-painted backgrounds, teal-and-amber night grade, atmospheric haze, dynamic composition
  negative: "No on-screen text, no subtitles, no logos, no watermarks, no extra characters."

# Recurring cast: `reelbot cast` draws sheet options, you pick one per character in Telegram,
# and every shot then gets that sheet as a reference image.
characters:
  - name: Kai
    short: "lanky courier in round glasses and an orange jacket"
    description: "Kai, a lanky courier in his 20s with messy black hair, round glasses and an oversized orange jacket"

cast:
  candidates: 3
  aspect_ratio: "16:9"

episodes:
  - {category: "Night metro driver", emoji: "🚇", idea: "last train, one passenger who never gets off"}
  - {category: "Bridge lamp keeper", emoji: "🏮"}
  - {category: "Rooftop courier", emoji: "📦"}

shots:
  count: 5          # hook / escalate / clash / climax / twist
  duration_s: 3

# Endpoint IDs + input field names come from each model's API page on open.higgsfield.ai.
# Placeholders: {prompt} {image_urls} {image_url} {duration} {aspect_ratio} {negative_prompt}.
# Exact "{x}" keeps the raw type; empty lists/None are dropped from the request.
models:
  image:
    endpoint: "xai/grok-imagine-image-2.0"
    input:
      prompt: "{prompt}"
      image_urls: "{image_urls}"
      aspect_ratio: "{aspect_ratio}"
      quality: "medium"
      resolution: "1k"
    output_path: "images.0.url"
    cost_per_call: 0.04
  video:
    endpoint: "kling-video/v4.0/reference-to-video"
    input:
      prompt: "{prompt}"
      image_urls: "{image_urls}"
      duration: "{duration}"
      resolution: "720p"
      aspect_ratio: "{aspect_ratio}"
    output_path: "video.url"
    cost_per_second: 0.157
    ref_token: "@image_{n}"

music:
  provider: elevenlabs   # elevenlabs | library (assets/music, tracks you own) | none
  library_dir: assets/music
  cost_per_track: 0.0
  volume_db: -2.0

title_card:
  font: assets/fonts/Bangers-Regular.ttf
  subtitle: "A FILM BY {handle}"
  in_video: false
  cover: true

caption:
  template: "{header}\n\n{hook}\n\n{credits}\n\n{hashtags}"
  credits: "Made with Kling on Higgsfield · music by ElevenLabs"
  hashtags: ["#aianimation", "#aifilm", "#aishortfilm", "#anime", "#aigenerated"]

budget:
  monthly_usd: 40
  per_reel_usd: 4.0

schedule:
  generate_at: "10:00"
  publish_at: "19:30"
  days: [mon, wed, fri]
