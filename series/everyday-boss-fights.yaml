# EVERYDAY BOSS FIGHTS — @everydaybossfights  (v3: one take with cuts inside, opening frame, SFX + music)
# Ordinary life problems, animated like a shonen final-boss battle, with a deadpan anticlimax.

series:
  name: "EVERYDAY BOSS FIGHTS"
  handle: "everydaybossfights"
  premise: >
    Every episode, Juno fights one tiny everyday problem as if it were the final boss of an anime:
    the last metro, a 2% phone battery, a pickle jar that will not open. Five wordless beats:
    hook (the ordinary moment and its stakes), escalate (she commits, power aura flickers on),
    clash (the mundane task staged as an epic shonen battle: speed lines, debris, low hero angles),
    climax (the decisive instant, often slow motion or an extreme close-up), twist (a deadpan
    anticlimax: Mochi steals the win, or the problem solves itself in the dumbest way).
    Universal, not tied to one country. Wholesome humour, never cruel. Light romance is welcome:
    Juno's crush on Ren (a call, a text, a first date, at most a peck on the cheek), her feelings
    blown up into anime spectacle while Mochi judges. Both are adults; never sexual or explicit.
  total_episodes: 100
  header_template: "{series}\nBoss {n} / {total}\n{emoji} {category}"

style:
  # appended to every shot and plate prompt (keep it descriptive; no studio or artist names)
  bible: >
    2D anime feature-film look: confident clean ink linework, cel-shaded characters with soft painterly
    gradients, hand-painted brush-textured backgrounds, cinematic colour grade with warm highlights and
    cool shadows, atmospheric haze and soft bloom, dynamic composition, expressive acting, crisp detail
  negative: >
    No on-screen text, no subtitles, no captions, no logos, no watermarks, no extra characters,
    no distorted faces or hands.
  # how it moves, stated once per take prompt (anime technique from the Seedance anime guides)
  animation: >
    expressive hand-drawn anime acting with constant micro-motion (breathing, blinking, hair and
    fabric moving); fast moves get smear frames and speed lines from a vanishing point; a held pose
    at every peak before the release; hard-edged cel shadows; the deadpan beats are still

characters:
  - name: Juno
    short: "teal-haired girl in an oversized mustard hoodie"
    look: "short messy teal bob, amber eyes, band-aid on her left cheek, oversized mustard-yellow hoodie, black cargo shorts, chunky white high-top sneakers"
    description: >
      Juno, a young woman in her early 20s with a short messy teal bob, amber eyes, a small band-aid on
      her left cheek, an oversized mustard-yellow hoodie with no logo, black cargo shorts and chunky white
      high-top sneakers; slim, energetic, expressive
  - name: Mochi
    short: "chubby orange tabby cat with a red scarf"
    look: "chubby orange tabby, white paws, tiny red knitted scarf, half-lidded unimpressed eyes"
    description: >
      Mochi, a chubby orange tabby cat with white paws, a tiny red knitted scarf and a permanently
      unimpressed half-lidded expression
    speaks: false        # a cat: sounds only, never lines
  - name: Ren
    short: "curly-haired young man in round glasses and a green bomber jacket"
    look: "soft dark curly hair, round wire glasses, forest-green bomber jacket over a plain white tee, light-wash jeans, white canvas sneakers"
    description: >
      Ren, Juno's crush, a young man in his mid-20s with warm brown skin, soft dark curly hair, round
      wire-rimmed glasses, a forest-green bomber jacket over a plain white tee, light-wash jeans and
      white canvas sneakers; tall, calm, kind, a little oblivious, a shy half-smile

cast:
  candidates: 3        # options per character to pick from in Telegram (~$0.04 each)
  aspect_ratio: "16:9" # turnaround sheets read best wide


# Episode N uses entry N. Scripted entries are fixed gags the planner must follow (it only adds
# shots, camera, timing and sound): one literal cause -> the feeling blown up into spectacle -> one
# payoff image that works with the sound off. Unscripted entries are ideas; past the end of the
# list the planner invents new bosses in the same spirit (and a story critic checks they read).
episodes:
  - category: "Last Metro"
    emoji: "🚇"
    location: "an underground metro platform at rush hour, train waiting with its doors open"
    stake: 'The door chime rings and the doors begin to close; Juno, phone to her ear, says "Two minutes, I swear!"'
    move: "Juno sprints the length of the platform and dives feet-first through the closing doors like a baseball slide"
    spectacle: "her sprint blasts a storm of newspapers into the air, sparks trail from her sneakers on the tiles, the doors slam shut a finger-width behind her heels in slow motion"
    payoff: 'inside the carriage, gasping on the floor, Juno looks up: Mochi is already sitting on the seat opposite, unimpressed; Juno says "...How?"'
    homage: "the classic adventure-movie slide under a closing stone door at the very last second, reaching back as it slams"
  - category: "2% Battery"
    emoji: "🔋"
    location: "a cosy small apartment living room in the evening, sofa, lamp, charger cable plugged into the far wall"
    stake: 'Juno is on a video call on the sofa when her phone flashes a big red empty-battery icon; she says "No, no, no, not now!"'
    move: "Juno launches herself over the back of the sofa and lunges for the charger cable on the far wall"
    spectacle: "slow-motion leap with speed lines, cushions and popcorn exploding into the air, the lamp swinging wildly"
    payoff: "the cable is too short: Juno lies stretched flat on the floor holding the phone up at full arm's length, and Mochi sits down on her back"
    homage: "a heist-movie vault dive in slow motion over a laser grid"
  - category: "He Called"
    emoji: "📞"
    location: "Juno's small apartment bedroom at dusk, bed by a big window, potted plants on the sill, city skyline outside"
    stake: 'Her phone buzzes with Ren calling; diagonal split screen, Ren on a rooftop says "So... ramen, Saturday?" and Juno, very calm, says "Yeah. Cool. Sure."'
    move: "Juno hangs up, sets the phone down neatly, then screams silently into her pillow, both fists pounding the bed"
    spectacle: "her joy erupts as a pink shockwave: every plant on the sill bursts into bloom, the window glass ripples, the wave rolls out over the city and lights up every window in the skyline"
    payoff: "across the city on his rooftop, Ren is doing the exact same pillow scream into his jacket; on Juno's bed, Mochi covers his ears with his paws"
    homage: "a romantic-comedy split-screen phone call where both sides secretly mirror each other"
  - category: "Pickle Jar"
    emoji: "🫙"
    location: "a small bright kitchen, a big glass pickle jar on the counter"
    stake: 'Juno grips the pickle jar with both hands; the lid will not budge; she says "You. Will. Open."'
    move: "Juno braces a foot against the counter and twists the lid with everything she has"
    spectacle: "a golden power aura flares around her, the kitchen lights flicker, cutlery rattles, the floor tiles crack under her feet, her face turns red"
    payoff: "the lid still won't move; Mochi hops onto the counter, taps the lid once with a paw and it pops off; Juno stares, frozen"
    homage: "a shonen anime power-up: screaming, a blazing aura, the ground cracking, rocks floating"
  - category: "Mosquito, 3 AM"
    emoji: "🦟"
    location: "a dark bedroom at 3 AM, moonlight through curtains, Juno in bed, Mochi asleep on the pillow"
    stake: "a mosquito whines past Juno's ear; her eyes snap open in the dark, glowing with focus"
    move: "Juno tracks the mosquito and claps both hands together in one perfect strike"
    spectacle: "slow-motion clap, a shockwave blows the curtains open and knocks books off the shelf, moonlight floods the room"
    payoff: "Juno slowly opens her palms: empty. Extreme close-up: the mosquito sits calmly on the tip of her nose. Mochi watches from the pillow"
    homage: "a sci-fi bullet-time moment: everything freezes and the camera sweeps 360 degrees around the strike"
  - category: "Closing Elevator"
    emoji: "🛗"
    location: "a sunny office lobby with an elevator at the far end, its doors open"
    stake: 'The elevator doors start closing across the lobby; Juno, a full coffee cup in hand, shouts "Hold the door!"'
    move: "Juno sprints and leaps the last ten metres in a superhero dive, coffee held high"
    spectacle: "slow-motion flight across the lobby, papers swirling behind her, not a drop of coffee spilling"
    payoff: "the doors simply stop: Mochi, already inside, has a paw on the door; Juno lands flat at his feet, coffee perfect; she says \"...Thanks.\""
    homage: "a classic superhero flight shot: one fist forward, cape-like hoodie flapping, city-skyline energy"
  - category: "Last Slice"
    emoji: "🍕"
    location: "a living room at night, a pizza box with one slice left on the coffee table between Juno and Mochi on the sofa"
    stake: "one slice left; Juno and Mochi lock eyes over the open pizza box"
    move: "Juno slowly reaches for the slice like a gunslinger reaching for a holster, then lunges and grabs it"
    spectacle: "western-duel close-ups of eyes and paws, a popcorn tumbleweed rolls across the table, a clock ticks, wind blows her hair indoors"
    payoff: "Juno holds up her prize: it's only the crust. Mochi licks his whiskers, cheese on his red scarf"
    homage: "a spaghetti-western standoff: extreme close-ups of narrowed eyes, twitching fingers, a long silent hold"
  - category: "Umbrella vs Wind"
    emoji: "☔"
    location: "a street corner in a monsoon storm, a café window behind"
    stake: 'a huge gust hits as Juno opens her umbrella at the crossing; she says "Not today."'
    move: "Juno plants her feet and holds the umbrella into the storm like a shield"
    spectacle: "the wind hits like an anime boss attack, rain flying sideways, signs rattling, her sneakers sliding backwards with sparks"
    payoff: "the umbrella flips inside out and lifts Juno off the ground like a kite; she floats past the café window where Mochi sits, dry, sipping from a saucer"
    homage: "a storm-battle climax in a fantasy epic, ending like a nanny floating away on her umbrella over the rooftops"
  - category: "Instant Noodles"
    emoji: "🍜"
    location: "a small kitchen counter at night, a cup of instant noodles and a kitchen timer"
    stake: 'Juno pours boiling water into the noodle cup and starts a 3-minute timer; she says "Three minutes. Don''t blink."'
    move: "Juno stands guard over the cup in a battle stance, chopsticks drawn like twin swords"
    spectacle: "dramatic close-ups of the ticking timer, steam curling up like a dragon, lightning flashing behind her"
    payoff: "the timer rings; Juno peels the lid back and finds the flavour packet still sealed on top of the noodles; Mochi slowly blinks"
    homage: "a bomb-defusal thriller countdown: sweat, ticking close-ups, red light"
  - category: "Wet Floor"
    emoji: "🧽"
    location: "a shiny freshly mopped shopping-mall corridor with a yellow wet-floor sign"
    stake: "Juno hurries round the corner onto the freshly mopped floor, past the yellow wet-floor sign"
    move: "Juno slips and turns it into a perfect figure-skating spin"
    spectacle: "sparkles and slow motion, a triple spin, water spraying in glittering arcs, spotlights from nowhere"
    payoff: "Juno lands a perfect pose, arms wide; then the wet-floor sign tips over and bonks her on the head. Mochi, on a bench, gives a slow blink"
    homage: "an Olympic figure-skating gala finale: spotlight, perfect spin, freeze on the final pose"
  - category: "Tiny Spider"
    emoji: "🕷️"
    location: "a small bathroom in the morning, Juno at the sink with a toothbrush, a broom in the corner"
    stake: "a tiny spider drops on a thread right in front of Juno's face while she brushes her teeth"
    move: "Juno grabs the broom and raises it over her head like a legendary sword"
    spectacle: "thunder and wind, a heroic low angle, her hair blowing, the spider tiny and still in the frame"
    payoff: "the spider waves one tiny leg; Juno slowly lowers the broom and waves back. Mochi watches from the bathtub edge"
    homage: "a legendary hero lifting the sacred sword to the sky as lightning strikes"
  - {category: "Snooze Button", emoji: "⏰", idea: "6:00 AM alarm duel, her hand charges with energy for the snooze strike; twist: it's Sunday"}
  - {category: "Shared Umbrella", emoji: "☔", idea: "sudden rain, Ren offers to share his tiny umbrella; Juno's heartbeat summons a storm of cherry blossoms; twist: they both end up soaked, laughing, and Mochi is dry under the umbrella"}
  - {category: "One Trip", emoji: "🛍️", idea: "carrying every grocery bag in one trip, arms glowing with power; twist: her keys are in the pocket under all the bags"}
  - {category: "Flat-Pack Furniture", emoji: "🪑", idea: "the instruction manual as an ancient scroll, she assembles at god speed; twist: one screw left over"}
  - {category: "One Bar of Wi-Fi", emoji: "📶", idea: "climbing onto the rooftop holding her phone to the sky; twist: the message finally sends: a thumbs up"}
  - {category: "Melting Ice Cream", emoji: "🍦", idea: "race against the summer sun to finish the cone; twist: the scoop falls, Mochi is waiting below"}
  - {category: "Monday Morning", emoji: "📅", idea: "Monday as a giant shadow kaiju over the city; twist: she defeats it and it splits into Tuesday"}
  - {category: "First Date Outfit", emoji: "👗", idea: "trying on outfits for the ramen date at light speed, clothes exploding everywhere like a tornado; twist: Ren arrives in the exact same mustard hoodie"}
  - {category: "Exam Clock", emoji: "✏️", idea: "last minute of the exam, writing at light speed; twist: she forgot to write her name"}
  - {category: "Laundry Mountain", emoji: "🧺", idea: "folding a laundry tower with martial-arts precision; twist: Mochi dives into the tower"}
  - {category: "Flash Sale", emoji: "⏳", idea: "checkout countdown 3, 2, 1, she taps buy; twist: sold out"}
  - {category: "Lost Earbud", emoji: "🎧", idea: "searching the whole room like a detective with a flashlight; twist: it was in her ear all along"}
  - {category: "Six Cups of Chai", emoji: "☕", idea: "carrying a full tray of tea glasses through a crowded street with perfect balance; twist: she sneezes"}
  - {category: "Holding a Sneeze", emoji: "🤧", idea: "silent library, she fights a sneeze with all her willpower; twist: Mochi sneezes instead"}
  - {category: "Tangled Cable", emoji: "🔌", idea: "untangling earphones like defusing a bomb; twist: it re-tangles instantly in her pocket"}
