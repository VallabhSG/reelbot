facebook:
  # Meta's "AI info" label on every reel: label ourselves before Instagram/Facebook make us
  ai_label: true

budget:
  monthly_usd: 40
  per_reel_usd: 9.0       # one take: Kling 3.0 ~$1.9, Seedance 2.0 ~$2.4 (OpenRouter), 2.5 ~$8.5

schedule:
  generate_at: "10:00"
  publish_at: "19:30"
  # 3 a week: ~$2.60 a reel on OpenRouter (Seedance 2.0 + Higgsfield frames) is ~$34 a month,
  # inside the $40 cap (with room for a retake or two; the guard stops at the cap anyway).
  days: [tue, thu, sat]
  # Every episode goes to all three platforms at once, at publish_at on the day it's made (Val,
  # 31 Oct). To spread a reel over days again, list the platforms in order, e.g.
  # stagger: [instagram, youtube, facebook] (one a day), and rotate: true to shift that weekly.
  stagger: []
  rotate: false
