# Famous movie moments for unscripted episodes to restage (film language only). Recognisable
# energy, our cast, our everyday stakes: the planner picks the one that fits each gag.
homages:
  - "a sci-fi bullet-time dodge: everything freezes, the camera sweeps 360 degrees"
  - "a spaghetti-western standoff: extreme close-ups of eyes and twitching fingers"
  - "a heist-movie slow-motion dive through a laser grid"
  - "a superhero three-point landing that cracks the ground"
  - "an action hero walking away in slow motion as an explosion blooms behind, never looking back"
  - "a ship's-bow 'flying' pose with arms spread wide into the wind"
  - "a racing-movie launch: close-ups of the gear stick, the foot on the pedal, the tyres smoking"
  - "a shonen anime power-up: screaming, blazing aura, rocks floating, ground cracking"
  - "a disaster-movie escape: running toward camera as everything collapses behind"
  - "a samurai duel: two figures pass each other, one beat of silence, then the cut lands"
  - "a sports-movie final shot in slow motion, the whole crowd holding its breath"
  - "a horror-movie slow door creak and a jump scare that turns out to be harmless"
  - "a kung-fu training montage with sharp whip pans and snap zooms"
  - "a space-launch countdown: rumble, steam, the final 3-2-1"
  - "a fantasy hero lifting a sacred sword to the sky as lightning strikes"

shots:              # v2 only (one call per shot); v3 uses `take` below
  count: 5          # hook / escalate / clash / climax / twist
  duration_s: 3     # 5 x 3 s = 15 s, ~3 s per cut like the reference reels

# v3: the whole reel is ONE generation with hard cuts inside it, so characters, light and action
# carry across the cuts (v2's separate 3 s clips couldn't). The opening frame is painted first with
# the approved cast sheets + the location plate, and the video starts from it.
take:
  enabled: true
  seconds: 15
  shots: 6           # 1-4 s each (the reference reels cut every ~1 s, on the beat)
  model: seedance2      # default for scheduled reels; a bake-off winner overrides it
  # Bake-off (Actions -> bakeoff): one storyboard on each model, pick the winner in Telegram and it
  # becomes the default. seedance2_ref is the same model and price with the cast sheets attached
  # (reference mode); add seedance25_ref in the args box to test the newer model too (~$3.70 a reel).
  bakeoff: [seedance2, seedance2_ref]
  dialogue: bookends # short lines at the start and the twist, wordless action in between
  max_lines: 3
  subtitles: true
  sfx_volume_db: -8  # the model's own sound effects sit under the music (music-led, like the reference)
  music_volume_db: 0
  climax_dip_s: 0.8  # music drops right before the climax and slams back on it
  music_bpm: 120     # cuts land on whole seconds = beats at 120 BPM

models:
  # Character sheets + one empty location plate per episode. Takes reference images, so it can
  # also keep looks consistent. ~$0.04/image (open.higgsfield.ai, Oct 2026).
  image:
    endpoint: "xai/grok-imagine-image-2.0"
    input:
      prompt: "{prompt}"
      image_urls: "{image_urls}"
      aspect_ratio: "{aspect_ratio}"
      quality: "medium"
      resolution: "1k"
    output_path: "images.0.url"
    cost_per_call: 0.04

  # Kling 4.0 Reference-to-Video (released 23 Oct 2026): every shot gets the cast sheets + the
  # location plate as @image_N references. 720p, 9:16. List $0.157/s, $0.1099/s on the current
  # 30%-off promo; the guard charges list price.
  video:
    endpoint: "kling-video/v4.0/reference-to-video"
    input:
      prompt: "{prompt}"
      image_urls: "{image_urls}"
      duration: "{duration}"
      resolution: "720p"
      aspect_ratio: "{aspect_ratio}"
    output_path: "video.url"
    cost_per_second: 0.157
    ref_token: "@image_{n}"

  # v3 one-take models (Higgsfield). Fields from docs.higgsfield.ai; prices are list prices the
  # budget guard charges (Higgsfield often runs 30% off, so real spend is lower).
  takes:
    # Kling 3.0 Pro image-to-video: starts from the composed opening frame; native multi-shot
    # (up to 6 shots, each {prompt <=512 chars, duration}), native sound, 3-15 s. Prompt <=2,500.
    kling3:
      label: "Kling 3.0"
      endpoint: "kling-video/v3.0/pro/image-to-video"
      input:
        image_url: "{start_image}"
        prompt: "{prompt_global}"
        multi_shots: true
        multi_prompt: "{shots}"
        duration: "{duration}"
        sound: "on"
      output_path: "video.url"
      cost_per_second: 0.12
      ref_token: ""
      start_frame: true
      max_prompt_chars: 2500
    # Seedance 2.0 image-to-video on OpenRouter: the same ByteDance model at ByteDance's own price
    # ($7 per 1M video tokens: 720x1280 x 24 fps / 1024 = ~$0.151/s, ~$2.27 a 15 s reel; +5.5%
    # OpenRouter fee on top-ups). Same opening frame, cuts written into the prompt, native audio.
    # 4-15 s. Images (opening frame, plate, cast sheets) stay on Higgsfield.
    seedance2:
      label: "Seedance 2.0"
      provider: openrouter
      fallback: seedance2_hf   # OpenRouter down or refusing: same model on Higgsfield (~2x the price)
      endpoint: "bytedance/seedance-2.0"
      input:
        prompt: "{prompt}"
        duration: "{duration}"
        resolution: "720p"
        aspect_ratio: "{aspect_ratio}"
        generate_audio: true
        frame_images:
          - type: image_url
            image_url: { url: "{start_image}" }
            frame_type: first_frame
      output_path: ""
      cost_per_second: 0.16
      ref_token: ""
      start_frame: true
      # Long production prompts with the director's pass: ~1,700-2,200 words, longer than any
      # published sample (ByteDance's run 500-1,500; the API takes ~20,000 characters). Over the cap,
      # each shot loses its sound and last frame first. Shared with the fallback below.
      max_prompt_chars: 14000
    # Seedance 2.0 on OpenRouter in reference mode: same price, but the model gets the opening frame
    # AND every cast sheet (Juno, Mochi, Ren), so faces and outfits hold after every cut instead of
    # being redrawn from words. ByteDance's reference syntax: "@Image 1 as the first frame".
    # The top accounts (kenai.film: "created using seedance 2.5") all work from references.
    seedance2_ref:
      label: "Seedance 2.0 + cast refs"
      provider: openrouter
      fallback: seedance2_hf
      endpoint: "bytedance/seedance-2.0"
      input:
        prompt: "{prompt}"
        duration: "{duration}"
        resolution: "720p"
        aspect_ratio: "{aspect_ratio}"
        generate_audio: true
        input_references: "{image_refs}"
      output_path: ""
      cost_per_second: 0.16
      ref_token: "@Image {n}"
      start_frame: true
      max_prompt_chars: 14000
    # Seedance 2.5 on OpenRouter, reference mode ($10.7 per 1M video tokens: ~$3.66 a 15 s reel).
    seedance25_ref:
      label: "Seedance 2.5 + cast refs"
      provider: openrouter
      fallback: seedance2_hf
      endpoint: "bytedance/seedance-2.5"
      input:
        prompt: "{prompt}"
        duration: "{duration}"
        resolution: "720p"
        aspect_ratio: "{aspect_ratio}"
        generate_audio: true
        input_references: "{image_refs}"
      output_path: ""
      cost_per_second: 0.25
      ref_token: "@Image {n}"
      start_frame: true
      max_prompt_chars: 14000
    # The same model on Higgsfield (~$0.30/s, twice the price): set take.model to seedance2_hf to
    # switch back, e.g. if OpenRouter is down.
    seedance2_hf:
      label: "Seedance 2.0"
      endpoint: "bytedance/seedance-2.0/image-to-video"
      input:
        image_url: "{start_image}"
        prompt: "{prompt}"
        duration: "{duration}"
        resolution: "720p"
        generate_audio: true
      output_path: "video.url"
      cost_per_second: 0.31
      ref_token: ""
      start_frame: true
      max_prompt_chars: 14000
    # Seedance 2.5 reference-to-video: what the top accounts in this niche credit (dyyhoang_aiker,
    # kenai.film). Gets the location plate + character sheets as references, like their published
    # prompts ("use image 1 as the location reference..."). 4-30 s. ~$0.56/s list at 720p.
    seedance25:
      label: "Seedance 2.5"
      endpoint: "bytedance/seedance-2.5/reference-to-video"
      input:
        image_urls: "{image_urls}"
        video_urls: "{video_urls}"   # an episode's reference_video, when it has one
        prompt: "{prompt}"
        duration: "{duration}"
        resolution: "720p"
        aspect_ratio: "{aspect_ratio}"
        generate_audio: true
      output_path: "video.url"
      cost_per_second: 0.56
      ref_token: "image {n}"
      start_frame: false

music:
  provider: elevenlabs
  library_dir: assets/music
  cost_per_track: 0.0
  volume_db: -2.0

title_card:
  font: assets/fonts/Bangers-Regular.ttf   # SIL OFL 1.1, see Bangers-OFL.txt
  subtitle: "BOSS FIGHT #{nn}"
  color: "#FFC93C"          # brand mustard yellow, matches Juno's hoodie
  stroke_color: "#14110F"
  stroke_width: 10
  y_ratio: 0.70
  in_video: false           # keep the hook shot clean ...
  cover: true               # ... and use climax frame + title as the Reels poster cover

caption:
  template: "{header}\n\n{hook}\n\n{credits}\n\n{hashtags}"
  credits: "AI-animated with {model} · frames on Higgsfield · music by @elevenlabs"
  # Instagram allows 5 since Dec 2025 (1-2 broad, 1-2 medium, 1 niche); keywords in the caption
  # matter more for search now
  hashtags: ["#anime", "#relatable", "#aianimation", "#aishortfilm", "#bossfight"]
  # Affiliate links: every post carries one labelled line per link, just above the hashtags, on
  # Instagram too (not clickable there, but copyable). To point Instagram to the bio instead, add
  # e.g.  instagram: "🎨 Frames made on Higgsfield · affiliate link in bio"
  affiliates:
    - url: "https://higgsfield.ai?fpr=vallabh-8bf470"
      link_text: "🎨 Frames made on Higgsfield (affiliate link): {url}"
    - url: "https://try.elevenlabs.io/8k8afoea9y48"
      link_text: "🎵 Music by ElevenLabs (affiliate link): {url}"

# Date-pinned episodes (festivals, seasonal moments): planned on that date instead of the next
# numbered entry, which waits. Only on an episode day (schedule.days). From the playbook (P13).
specials:
  - date: 2026-11-05
    category: "Diwali ki Safai"
    emoji: "🪔"
    idea: "Diwali cleaning: Juno vs the ceiling fan nobody has cleaned since last Diwali, a year of dust; Mochi supervises from the one clean sofa"
