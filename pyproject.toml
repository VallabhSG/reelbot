[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reelbot"
version = "0.1.0"
description = "Automated AI short-film Reels pipeline: plan -> Higgsfield keyframes/video -> ElevenLabs music -> ffmpeg -> Telegram review -> Instagram"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "pillow>=10.3",
  "boto3>=1.34",
  "tenacity>=8.3",
]

[project.optional-dependencies]
music = ["elevenlabs>=2.0"]
dev = ["pytest>=8.2", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
reelbot = "reelbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reelbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is owned by `ruff format`; long string literals are fine
