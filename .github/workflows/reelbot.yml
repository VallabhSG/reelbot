name: reelbot

# Hosting on GitHub Actions: every run pulls state from the private R2 bucket, does one worker
# pass, and pushes state back. All config + secrets come from ONE repo secret: ENV_FILE.
on:
  schedule:
    # every 30 min, 08:30-23:30 IST (03:00-17:30 UTC). GitHub may delay scheduled runs at peak.
    - cron: "*/30 3-17 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "reelbot command"
        type: choice
        options: [tick, smoke, make, status, check]
        default: tick

concurrency:
  group: reelbot-worker  # never two runs touching state at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Cache venv
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install reelbot
        run: |
          if [ ! -x .venv/bin/python ]; then python -m venv .venv; fi
          .venv/bin/pip install -q -e ".[music]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then echo "::error::Repo secret ENV_FILE is not set"; exit 1; fi
          printf '%s\n' "$ENV_FILE" > .env

      - name: Pull state
        id: pull
        run: reelbot state pull

      - name: Run
        run: reelbot ${{ inputs.command || 'tick' }}

      - name: Push state
        # only if pull worked: a failed pull must never overwrite good remote state
        if: always() && steps.pull.outcome == 'success'
        run: reelbot state push
