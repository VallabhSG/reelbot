name: reelbot

# Hosting on GitHub Actions: every run pulls state from the private R2 bucket, does one worker
# pass, and pushes state back. All config + secrets come from ONE repo secret: ENV_FILE.
on:
  schedule:
    # Only the fixed times: Telegram taps start their own run through the relay (webhook mode), so
    # nothing needs polling. 4 short runs a day keep a private repo far inside the free 2,000
    # min/month. Each time has a backup 30 min later, because GitHub delays and sometimes drops
    # scheduled runs; a backup that finds nothing to do exits in under a minute.
    - cron: "35 4 * * *"   # 10:05 IST: make the episode on episode days (series schedule.days)
    - cron: "5 5 * * *"    # 10:35 IST: backup
    - cron: "2 14 * * *"   # 19:32 IST: publish what's due, measure reels, Sunday report
    - cron: "32 14 * * *"  # 20:02 IST: backup
  workflow_dispatch:
    inputs:
      command:
        description: "reelbot command"
        type: choice
        options: [tick, make, approve, reject, note, lessons, stats, youtube, facebook, webhook, retake, bakeoff, cast, pick, regen, status, smoke, check]
        default: tick
      args:
        description: "arguments, e.g. approve: 7 · reject: 7 the payoff made no sense · note: 7 opening too static · lessons: --update · approve: 2 --now · pick: Juno 3 Mochi 1"
        type: string
        required: false
        default: ""

concurrency:
  group: reelbot-worker  # never two runs touching state at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # a 3-model bake-off renders three takes in one run
    steps:
      # Checked first so runs before setup exit in seconds instead of failing (and emailing) every 30 min.
      - name: Check ENV_FILE secret
        id: env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::notice::Repo secret ENV_FILE is not set yet; skipping this run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub masks ENV_FILE only as whole lines; mask each key/token/secret value on its own so
          # one embedded in an error message (e.g. an API URL) never shows up in the logs.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ""|\#*) continue ;; esac
            key="${line%%=*}"
            val="${line#*=}"
            val="${val%% #*}"
            val="${val#"${val%%[![:space:]]*}"}"
            val="${val%"${val##*[![:space:]]}"}"
            val="${val#\"}"; val="${val%\"}"
            case "$key" in *KEY*|*SECRET*|*TOKEN*) [ -n "$val" ] && echo "::add-mask::$val" ;; esac
          done <<< "$ENV_FILE"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.env.outputs.configured == 'true'

      - uses: actions/setup-python@v5
        if: steps.env.outputs.configured == 'true'
        id: py
        with:
          python-version: "3.12"

      - name: Cache venv
        if: steps.env.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install reelbot
        if: steps.env.outputs.configured == 'true'
        # The cached venv (keyed on pyproject.toml) already holds the editable install: skip pip
        # then, it costs ~20 s of billed time on every run.
        run: |
          if [ ! -x .venv/bin/reelbot ]; then
            python -m venv .venv
            .venv/bin/pip install -q -e ".[music]"
          fi
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg
        if: steps.env.outputs.configured == 'true'
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Write .env
        if: steps.env.outputs.configured == 'true'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Pull state
        id: pull
        if: steps.env.outputs.configured == 'true'
        run: reelbot state pull

      - name: Run
        if: steps.env.outputs.configured == 'true'
        env:  # via env, never pasted into the script: the args box can't inject shell code
          CMD: ${{ inputs.command || 'tick' }}
          ARGS: ${{ inputs.args }}
        run: |
          set -f  # no glob expansion of the args
          echo "reelbot $CMD $ARGS"
          reelbot "$CMD" $ARGS

      - name: Push state
        # only if pull worked: a failed pull must never overwrite good remote state
        if: always() && steps.pull.outcome == 'success'
        run: reelbot state push
